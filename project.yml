name: CalPeek
options:
  bundleIdPrefix: com.briangibson
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
targets:
  CalPeek:
    type: application
    platform: macOS
    sources:
      - path: CalPeek
      # In the project for visibility/editing only — .storekit files have no
      # build phase; the scheme references it for local StoreKit testing.
      - path: CalPeek.storekit
        buildPhase: none
      # Written by the pre-build script below, gitignored. `optional` keeps
      # `xcodegen generate` working on a fresh clone, before any build has
      # produced the file.
      - path: Generated/BuildInfo.generated.swift
        optional: true
    preBuildScripts:
      # Runs ahead of the Sources phase, so the generated file always exists
      # by the time swiftc reaches it.
      - name: Generate Build Info
        script: bash "$SRCROOT/Scripts/generate-build-info.sh"
        outputFiles:
          - $(SRCROOT)/Generated/BuildInfo.generated.swift
        # The SHA changes without any tracked input file changing, so
        # dependency analysis would wrongly skip this.
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangibson.calpeek
        PRODUCT_NAME: CalPeek
        # Drives CFBundleDisplayName. Kept separate from PRODUCT_NAME so the
        # Debug build can be renamed for humans (Finder, Force Quit, the
        # Login Items list) without renaming the executable or the .app —
        # which would break the test target's TEST_HOST path.
        PRODUCT_DISPLAY_NAME: CalPeek
        INFOPLIST_FILE: CalPeek/Info.plist
        CODE_SIGN_ENTITLEMENTS: CalPeek/CalPeek.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Stable signing identity so TCC grants (Calendar/Reminders) survive
        # rebuilds — ad-hoc builds get a new TCC identity on every compile.
        DEVELOPMENT_TEAM: LK42KQYP3M
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        # Debug builds get their own bundle ID so local development can't
        # collide with an installed App Store/TestFlight build: separate
        # sandbox container (and therefore separate UserDefaults), separate
        # TCC grants, and separate Launch at Login registration.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.briangibson.calpeek.debug
          PRODUCT_DISPLAY_NAME: CalPeek Debug
    scheme:
      testTargets:
        - CalPeekTests
      # Local StoreKit testing: lets Debug builds buy/refund CalPeek Pro without
      # App Store Connect or a sandbox account.
      storeKitConfiguration: CalPeek.storekit
  CalPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CalPeekTests
    dependencies:
      - target: CalPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briangibson.calpeek.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # Must match the app target's team — a test bundle signed by a
        # different identity refuses to load into the host process.
        DEVELOPMENT_TEAM: LK42KQYP3M
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CalPeek.app/Contents/MacOS/CalPeek
        BUNDLE_LOADER: $(TEST_HOST)
