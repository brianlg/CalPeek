name: Peek
options:
  bundleIdPrefix: com.peek
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  Peek:
    type: application
    platform: macOS
    sources:
      - path: Peek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peek.Peek
        PRODUCT_NAME: Peek
        INFOPLIST_FILE: Peek/Info.plist
        CODE_SIGN_ENTITLEMENTS: Peek/Peek.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Stable signing identity so TCC grants (Calendar/Reminders) survive
        # rebuilds — ad-hoc builds get a new TCC identity on every compile.
        DEVELOPMENT_TEAM: LK42KQYP3M
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets:
        - PeekTests
  PeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PeekTests
    dependencies:
      - target: Peek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peek.PeekTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # Must match the app target's team — a test bundle signed by a
        # different identity refuses to load into the host process.
        DEVELOPMENT_TEAM: LK42KQYP3M
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Peek.app/Contents/MacOS/Peek
        BUNDLE_LOADER: $(TEST_HOST)
